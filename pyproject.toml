[project]
name = "pwndbg-mcp"
version = "2.0.0a1"
description = "MCP server for current pwndbg and GDB workflows"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "constantines" }]
requires-python = ">=3.11"
keywords = [
    "pwndbg",
    "gdb",
    "mcp",
    "claude",
    "claude-code",
    "ctf",
    "pwn",
    "reverse-engineering",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "fastmcp>=2.14.7,<3",
    "pygdbmi>=0.11.0,<1",
    "pwntools>=4.14.1,<5",
    "typing-extensions>=4.12,<5",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6,<1",
    "mypy>=1.10,<2",
]

[project.scripts]
pwndbg-mcp = "pwndbg_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/h0w1tzxr/pwndbg-mcp"
Issues = "https://github.com/h0w1tzxr/pwndbg-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pwndbg_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
    "/install.py",
]

[tool.uv]
default-groups = []
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["A", "E", "F", "W", "C4", "I", "ISC", "PGH", "RET", "UP"]
ignore = ["A003", "E402", "E501", "E731"]

[tool.ruff.lint.isort]
force-single-line = true
known-third-party = ["fastmcp", "pygdbmi", "pwn", "pwnlib"]
required-imports = ["from __future__ import annotations"]

[tool.mypy]
python_version = "3.11"
strict_optional = false
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
pretty = true

[[tool.mypy.overrides]]
module = ["pwn.*", "pwnlib.*", "pygdbmi.*", "fastmcp.*"]
ignore_missing_imports = true
